name: RunTests
on: push

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Check code lints with Ruff
        run: make lint

      - name: Check code formats with Ruff
        run: make format

  integration-tests:
    runs-on: ubuntu-latest
    needs: [ruff]

    # Service containers to run with `integration-tests`
    services:
      # Label used to access the service container
      nestserver:
        # Docker Hub image
        image: nest/nest-simulator:3.10
        env:
          NEST_CONTAINER_MODE: nest-server
          NEST_SERVER_STDOUT: 1
        ports:
          - 52425:52425
        options: >-
          --health-cmd "curl http://localhost:52425"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - run: env | sort

      - run: curl http://localhost:52425

      - run: >
          echo '{"mpi":false,"nest":"3.10.0"}' >expected;
          curl -s http://localhost:52425 | diff -u expected -
    env:
      server_version: "3.10"

  pytest:
    runs-on: ubuntu-latest
    needs: [ruff, integration-tests]

    # Service containers to run with `pytest`
    services:
      # Label used to access the service container
      nestserver:
        # Docker Hub image
        image: nest/nest-simulator:3.10
        env:
          NEST_CONTAINER_MODE: nest-server
          NEST_SERVER_STDOUT: 1
        ports:
          - 52425:52425
        options: >-
          --health-cmd "curl http://localhost:52425"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run pytest
        run: make test

  pytest-all:
    runs-on: ubuntu-latest
    needs: [ruff, integration-tests]

    # Service containers to run with `pytest`
    services:
      # Label used to access the service container
      nestserver:
        # Docker Hub image
        image: nest/nest-simulator:3.10
        env:
          NEST_CONTAINER_MODE: nest-server
          NEST_SERVER_STDOUT: 1
        ports:
          - 52425:52425
        options: >-
          --health-cmd "curl http://localhost:52425"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run pytest for multiple Python versions
        run: make test-all
